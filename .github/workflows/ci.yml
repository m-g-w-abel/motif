name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Default is 6 hours; a cold Windows build is the slowest at ~15 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        # Normally ~35s; a stalled Ubuntu mirror otherwise hangs the job.
        timeout-minutes: 5
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! embeds the built UI, so build it first.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: TypeScript bindings are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code apps/ui/src/lib/protocol
