[workspace]
resolver = "3"
members = ["crates/*", "apps/headless", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
engine = { path = "crates/engine" }
library = { path = "crates/library" }
integrations = { path = "crates/integrations" }
server = { path = "crates/server" }

axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
mimalloc = "=0.1.52"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.12.1"
tauri-build = "2.7.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
dirs = "7.0.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Line tables keep file:line in backtraces; full debug info doubled the build
# output and slowed linking.
[profile.dev]
debug = "line-tables-only"

# Image decoding and resizing are many times slower unoptimised (#59), so dev
# builds optimise dependencies; workspace crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 3
debug = false
