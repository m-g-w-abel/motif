[package]
name = "desktop"
description = "Tauri shell: the engine plus a window running the shared UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# staticlib/cdylib are needed for the Android build (phase 5).
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "motif"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
engine.workspace = true
library.workspace = true
integrations.workspace = true
mdns-sd = { version = "=0.21.6", default-features = false }
mimalloc.workspace = true
protocol.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
server.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# Only its store interface, which `secrets` fills with the Android Keystore.
keyring = { version = "=3.6.3", default-features = false }
serde_json.workspace = true
tauri-plugin-barcode-scanner = "=2.5.3"

[lints]
workspace = true
