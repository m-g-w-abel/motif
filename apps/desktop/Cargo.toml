[package]
name = "desktop"
description = "Tauri shell: the engine plus a window running the shared UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# staticlib/cdylib are needed for the Android build (phase 5).
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "motif"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
engine.workspace = true
library.workspace = true
integrations.workspace = true
mimalloc.workspace = true
server.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
