[package]
name = "library"
description = "Music library: folder scanning, tags, identity keys, SQLite database, artwork, file watching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
dirs.workspace = true
ebur128 = "=0.1.10"
opus = "0.4.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lofty = "=0.25.4"
notify = "=8.2.0"
protocol.workspace = true
# Same as the integrations crate's, blocking for LRCLIB lookups (lyrics.rs).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "blocking"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json.workspace = true
symphonia = { version = "0.6.1", features = ["all"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
walkdir = "2.5.0"

[target.'cfg(target_os = "android")'.dependencies]
# HTTPS roots for Android (tls_roots in lyrics.rs).
webpki-root-certs = "=1.0.9"

[lints]
workspace = true
