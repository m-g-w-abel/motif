[package]
name = "net"
description = "iroh transport between linked engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
iroh = "=1.4.1"
# iroh's own crates, held at the release matching iroh: cargo would take
# 1.5.0, a day old when this was written.
iroh-base = "=1.4.1"
iroh-dns = "=1.4.1"
n0-future = "=0.3.2"
iroh-relay = { version = "=1.4.1", default-features = false }
noq = { version = "=1.4.0", default-features = false }
noq-proto = { version = "=1.4.0", default-features = false }
noq-udp = { version = "=1.4.0", default-features = false }
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[lints]
workspace = true
