[package]
name = "integrations"
description = "Integrations with the OS and outside services: media controls (later scrobbling, Discord, lyrics)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
discord-rich-presence = "=1.1.0"
engine.workspace = true
library.workspace = true
protocol.workspace = true
serde_json.workspace = true
# Without a native store (Android) it falls back to a mock, which `settings` never uses there.
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
souvlaki = "0.8.3"
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
